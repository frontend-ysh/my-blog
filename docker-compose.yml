# 로컬 개발용 PostgreSQL.
#   시작: docker compose up -d
#   종료: docker compose down        (데이터는 db-data 볼륨에 남는다)
#   초기화: docker compose down -v   (데이터까지 삭제)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blog
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
